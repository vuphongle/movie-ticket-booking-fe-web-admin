services:
  frontend-admin:
    image: vuphongle23/movie-ticket-booking-fe-admin:latest
    container_name: movie-booking-frontend-admin
    ports:
      - "80:80"
    networks:
      - movie-ticket-booking-be_movie-booking-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  movie-ticket-booking-be_movie-booking-network:
    external: true
